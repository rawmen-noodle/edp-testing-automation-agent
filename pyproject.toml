[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m2c-ingest"
version = "1.0.0"
description = "SAP M2C flat-file ingestion to Azure Blob Storage with an Audit/Balance/Control framework"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.15",
    "azure-keyvault-secrets>=4.7",
    "azure-storage-blob>=12.19",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
m2c-ingest = "m2c_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
m2c_ingest = ["sql/*.sql"]
